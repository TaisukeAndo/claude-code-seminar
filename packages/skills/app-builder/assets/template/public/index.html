<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メモ帳（例）</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.6; }
      form { display: flex; gap: 8px; }
      input { flex: 1; font-size: 16px; padding: 10px; }
      button { font-size: 16px; padding: 10px 16px; }
      ul { list-style: none; padding: 0; }
      li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #ddd; }
      #message { color: #b00020; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>メモ帳（例）</h1>
    <form id="form">
      <input id="title" placeholder="メモの題名" autocomplete="off" />
      <button type="submit">追加</button>
    </form>
    <p id="message" role="alert"></p>
    <ul id="list"></ul>
    <script src="/app.js"></script>
  </body>
</html>
